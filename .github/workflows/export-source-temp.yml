name: Temporary source export
on:
  push:
    branches: [refactor/reconstruction-boundary]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pack exact source tree
        run: |
          set -euo pipefail
          git diff --exit-code
          tar --exclude=.git --exclude=.github/workflows/export-source-temp.yml \
            -czf "$RUNNER_TEMP/homr-source.tgz" .
          git rev-parse HEAD > "$RUNNER_TEMP/source.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: homr-source-export
          path: |
            ${{ runner.temp }}/homr-source.tgz
            ${{ runner.temp }}/source.sha
          retention-days: 1
