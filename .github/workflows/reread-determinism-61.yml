name: Reread determinism 61

on:
  push:
    branches: [diagnostic/reread-determinism-61]

permissions:
  contents: read

jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        mode: [default, deterministic, single, both]
        repetition: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked CPU runtime
        run: |
          python -m pip install -q poetry
          poetry config virtualenvs.in-project true
          poetry install --only main --extras cpu
      - name: Initialize CPU models
        run: poetry run python -c 'from homr.main import download_weights; download_weights(False, False, False)'
      - name: Trace one fresh process on this runner
        env:
          ORT_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reread-61"
          mkdir -p "$out"
          start=$(date +%s%N)
          TRACE_OUTPUT="$out/output.musicxml" PYTHONPATH="$PWD" \
            poetry run python .github/reread-diagnose.py > "$out/run.log" 2>&1
          end=$(date +%s%N)
          printf '%s\n' "$(( (end-start)/1000000 ))" > "$out/milliseconds.txt"
          sha256sum "$out/output.musicxml" > "$out/hash.txt"
          cat "$out/hash.txt"
          grep '^ENV ' "$out/run.log"
          grep '^SEGMENTATION ' "$out/run.log"
      - name: Preserve trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reread-61-${{ matrix.mode }}-${{ matrix.repetition }}
          path: ${{ runner.temp }}/reread-61
          retention-days: 3
