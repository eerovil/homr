name: Apply remaining completeness guard

on:
  push:
    branches: [fix/remaining-incomplete-recognition]

permissions:
  contents: read

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-completeness]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked development environment
        run: |
          python -m pip install -q poetry
          make init-poetry
          git restore -- poetry.lock pyproject.toml
      - name: Apply and format guard
        run: |
          set -euo pipefail
          python .github/remaining-completeness-guard.py
          poetry run black homr/staff_parsing.py tests/test_staff_completion_guards.py
          poetry run isort homr/staff_parsing.py tests/test_staff_completion_guards.py
      - name: Validate guard and existing failure behavior
        run: |
          set -euo pipefail
          poetry run ruff check homr/staff_parsing.py tests/test_staff_completion_guards.py
          poetry run mypy homr/staff_parsing.py tests/test_staff_completion_guards.py
          poetry run pytest -q --tb=short -o log_cli=false \
            tests/test_staff_completion_guards.py \
            tests/test_recognition_failures.py \
            tests/test_staff_parsing.py \
            tests/test_staff_layout_safety.py
          git restore -- poetry.lock pyproject.toml
          git diff --check
          git diff --exit-code -- fixtures fixturecheck
          echo 'Generated changes:'
          git status --short
      - name: Publish generated source on this temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="$(gh api repos/eerovil/homr/git/ref/heads/fix/remaining-incomplete-recognition --jq .object.sha)"
          test "$remote" = "$GITHUB_SHA"
          git add homr/staff_parsing.py tests/test_staff_completion_guards.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Reject header-only and invalid selected-staff reads' \
            -m 'A requested staff must contain at least a note or rest, and an explicit selected staff index must exist. Keep intentionally unselected rows untouched. No recognition heuristics or successful reads change.'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push https://github.com/eerovil/homr.git HEAD:refs/heads/fix/remaining-incomplete-recognition
