name: Five-fixture recognition

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recognition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOMR_REQUIRE_MODELS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked inference dependencies and pytest
        run: |
          python -m pip install poetry
          poetry config virtualenvs.in-project true
          poetry install --only main --extras cpu
          poetry run python -m pip install 'pytest==9.0.2'
      - name: Initialize CPU recognition models
        run: poetry run python -c 'from homr.main import download_weights; download_weights(False, False, False)'
      - name: Read and judge all five fixtures
        env:
          HOMR_FIXTURE_EVIDENCE: ${{ runner.temp }}/homr-fixture-evidence
        run: >-
          poetry run python -m pytest -q -rA --tb=short -o log_cli=false
          tests/test_recognition_fixtures.py
      # Temporary acceptance diagnostic: same tests/runtime/weights on original main.
      - name: Compare original main without changing reference criteria
        if: always()
        env:
          HOMR_FIXTURE_EVIDENCE: ${{ runner.temp }}/homr-fixture-evidence/baseline
        run: |
          set -euo pipefail
          root="$PWD"
          baseline="$RUNNER_TEMP/homr-baseline"
          python="$root/.venv/bin/python"
          git worktree add --detach "$baseline" 7612214795bc6205f5ef4860ea10981446849f41
          trap 'cd "$root"; git worktree remove --force "$baseline"' EXIT
          cp tests/test_recognition_fixtures.py tests/model_requirements.py "$baseline/tests/"
          while IFS= read -r model; do
            relative="${model#"$root/"}"
            ln -s "$model" "$baseline/$relative"
          done < <("$python" -c 'from homr.segmentation.config import segnet_path_onnx; from homr.transformer.configs import Config; c=Config().filepaths; print(segnet_path_onnx, c.encoder_path, c.decoder_path, sep="\n")')
          cd "$baseline"
          PYTHONPATH="$baseline" "$python" -m pytest -q -rA --tb=short -o log_cli=false tests/test_recognition_fixtures.py
      - name: Verify original inputs and acceptance criteria stayed unchanged
        if: always()
        run: git diff --exit-code -- fixtures fixturecheck/references.json
      - name: Preserve per-case logs, MusicXML and measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-fixture-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/homr-fixture-evidence
          if-no-files-found: warn
          retention-days: 14
