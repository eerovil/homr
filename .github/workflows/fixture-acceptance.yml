name: Five-fixture recognition

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recognition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOMR_REQUIRE_MODELS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked inference dependencies and pytest
        run: |
          python -m pip install -q poetry
          poetry config virtualenvs.in-project true
          poetry install --only main --extras cpu
          poetry run python -m pip install -q 'pytest==9.0.2'
      - name: Initialize CPU recognition models
        run: poetry run python -c 'from homr.main import download_weights; download_weights(False, False, False)'
      - name: Export a bounded local diagnostic bundle
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/homr-debug-export"
          mkdir -p "$out/wheels" "$out/models"
          paths=(homr fixturecheck tests pyproject.toml poetry.lock fixtures/stem-direction-fixtures.json)
          for name in hanget-soi kolme-kakea laulun-aika-s2 sammon-ryosto system4; do
            paths+=("fixtures/$name.png" "fixtures/$name.musicxml")
          done
          git archive HEAD "${paths[@]}" | gzip > "$out/candidate.tar.gz"
          git archive 7612214795bc6205f5ef4860ea10981446849f41 "${paths[@]}" | gzip > "$out/baseline.tar.gz"
          git rev-parse HEAD > "$out/candidate.sha"
          poetry run python -c 'from pathlib import Path; import os, shutil; from homr.segmentation.config import segnet_path_onnx; from homr.transformer.configs import Config; c=Config().filepaths; target=Path(os.environ["RUNNER_TEMP"])/"homr-debug-export/models"; [shutil.copyfile(p,target/Path(p).name) for p in (segnet_path_onnx,c.encoder_path,c.decoder_path)]'
          python -m pip download --disable-pip-version-check -q --no-deps --only-binary=:all: \
            --python-version 3.13 --implementation cp --abi cp313 \
            --platform manylinux_2_27_x86_64 --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 \
            --dest "$out/wheels" onnxruntime==1.24.1 rapidocr==3.7.0 pyclipper==1.4.0 flatbuffers==25.12.19
      - name: Preserve bounded diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: homr-debug-export
          path: ${{ runner.temp }}/homr-debug-export
          retention-days: 1
      - name: Read and judge all five fixtures
        env:
          HOMR_FIXTURE_EVIDENCE: ${{ runner.temp }}/homr-fixture-evidence
        run: >-
          poetry run python -m pytest -q -rA --tb=short -o log_cli=false
          tests/test_recognition_fixtures.py
      - name: Run focused architecture regressions together
        if: always()
        run: >-
          poetry run python -m pytest -q --tb=short --show-capture=no -o log_cli=false
          tests/test_segmentation_patches.py tests/test_segmentation_inference.py
          tests/test_model_requirements.py tests/test_stem_direction_fixtures.py
          tests/test_decoder_completion.py tests/test_recognition_failures.py
          tests/test_staff_parsing.py tests/test_staff_layout_safety.py
          tests/test_transformer_model_reuse.py
      - name: Verify original inputs and acceptance criteria stayed unchanged
        if: always()
        run: git diff --exit-code -- fixtures fixturecheck/references.json
      - name: Preserve per-case logs, MusicXML and measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-fixture-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/homr-fixture-evidence
          if-no-files-found: warn
          retention-days: 14
