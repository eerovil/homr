name: Apply system bounds 212

on:
  push:
    branches: [fix/system-bounds-212]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Wire explicit system bounds into the homr CLI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked development environment
        run: |
          python -m pip install -q poetry
          poetry config virtualenvs.in-project true
          poetry install --extras cpu
      - name: Apply, format and verify the exact integration
        run: |
          set -euo pipefail
          python .github/apply-system-bounds-212.py
          poetry run black homr/main.py homr/system_crops.py tests/test_system_crops.py tests/test_system_bounds_processing.py
          poetry run isort homr/main.py homr/system_crops.py tests/test_system_crops.py tests/test_system_bounds_processing.py
          poetry run black --check homr/main.py homr/system_crops.py tests/test_system_crops.py tests/test_system_bounds_processing.py
          poetry run isort --check-only homr/main.py homr/system_crops.py tests/test_system_crops.py tests/test_system_bounds_processing.py
          poetry run ruff check homr/main.py homr/system_crops.py tests/test_system_crops.py tests/test_system_bounds_processing.py
          poetry run mypy homr/main.py homr/system_crops.py tests/test_system_crops.py tests/test_system_bounds_processing.py
          poetry run pytest -q --tb=short -o log_cli=false tests/test_system_crops.py tests/test_system_bounds_processing.py
          git checkout -- poetry.lock
          git diff --check
          printf '%s\n' \
            homr/main.py \
            homr/system_crops.py \
            tests/test_system_bounds_processing.py \
            tests/test_system_crops.py > /tmp/expected-files
          git diff --name-only > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
      - name: Publish the reviewed integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add homr/main.py homr/system_crops.py tests/test_system_crops.py tests/test_system_bounds_processing.py
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Wire explicit system bounds into the homr CLI'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              push https://github.com/eerovil/homr.git HEAD:refs/heads/fix/system-bounds-212
