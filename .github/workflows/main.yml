name: CI

on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            poetry.lock

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install poetry
        run: |
          python -m pip install poetry

      - name: Init
        run: make init-poetry

      - name: Downloads models CPU
        run: poetry run homr --init --gpu no

      - name: CI
        env:
          HOMR_REQUIRE_MODELS: "1"
        run: make ci

      - name: Diagnose proposal checks
        if: failure()
        run: |
          poetry run black --diff homr/system_finder.py tests/test_system_finder.py tests/test_system_finder_startup.py
          poetry run isort --diff homr/image_prediction.py homr/system_finder.py tests/test_system_finder.py tests/test_system_finder_startup.py
          poetry run ruff check homr/image_prediction.py homr/system_finder.py tests/test_system_finder.py tests/test_system_finder_startup.py || true
          poetry run mypy homr/system_finder.py tests/test_system_finder.py tests/test_system_finder_startup.py || true

      - name: Downloads models GPU
        run: poetry run homr --init --gpu force
