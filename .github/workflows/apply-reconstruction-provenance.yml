name: Apply reconstruction provenance

on:
  push:
    branches: [provenance/reconstruction-work]

permissions:
  contents: read

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-provenance]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked development environment
        run: |
          python -m pip install -q poetry
          make init-poetry
          git restore -- poetry.lock pyproject.toml
      - name: Apply and format the reviewed transformation
        run: |
          set -euo pipefail
          python .github/reconstruction-provenance.py
          poetry run black \
            homr/score_reconstruction.py homr/music_xml_generator.py homr/main.py \
            tests/test_reconstruction_provenance.py
          poetry run isort \
            homr/score_reconstruction.py homr/music_xml_generator.py homr/main.py \
            tests/test_reconstruction_provenance.py
      - name: Validate provenance and existing reconstruction behavior
        run: |
          set -euo pipefail
          poetry run ruff check \
            homr/score_reconstruction.py homr/music_xml_generator.py homr/main.py \
            tests/test_reconstruction_provenance.py
          poetry run mypy \
            homr/score_reconstruction.py homr/music_xml_generator.py homr/main.py \
            tests/test_reconstruction_provenance.py
          poetry run pytest -q --tb=short -o log_cli=false \
            tests/test_reconstruction_provenance.py \
            tests/test_bar_arithmetic_repair.py \
            tests/test_inferred_meter_changes.py \
            tests/test_time_signature_nominator.py \
            tests/test_music_xml_generator.py \
            tests/test_decoder_confidence.py
          git restore -- poetry.lock pyproject.toml
          git diff --check
          git diff --exit-code -- fixtures fixturecheck
          echo 'Generated changes:'
          git status --short
      - name: Publish generated source on this temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="$(gh api repos/eerovil/homr/git/ref/heads/provenance/reconstruction-work --jq .object.sha)"
          test "$remote" = "$GITHUB_SHA"
          git add \
            homr/score_reconstruction.py homr/music_xml_generator.py homr/main.py \
            tests/test_reconstruction_provenance.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Record reconstruction repairs in diagnostics' \
            -m 'Capture rhythm repairs and inferred meter changes from the actual reconstruction used for MusicXML. Preserve top-level confidence sidecar version 1 with an additive reconstruction section. Existing XML behavior and reconstruction order stay unchanged.'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push https://github.com/eerovil/homr.git HEAD:refs/heads/provenance/reconstruction-work
