name: Apply system finder 213

on:
  push:
    branches: [feature/system-finder-213]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Expose system-bound proposal in the homr CLI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked development environment
        run: |
          python -m pip install -q poetry
          poetry config virtualenvs.in-project true
          poetry install --extras cpu
      - name: Apply and verify CLI integration
        run: |
          set -euo pipefail
          python .github/apply-system-finder-213.py
          poetry run black homr/main.py homr/system_finder.py tests/test_system_finder.py
          poetry run isort homr/main.py homr/system_finder.py tests/test_system_finder.py
          poetry run black --check homr/main.py homr/system_finder.py tests/test_system_finder.py
          poetry run isort --check-only homr/main.py homr/system_finder.py tests/test_system_finder.py
          poetry run ruff check homr/main.py homr/system_finder.py tests/test_system_finder.py
          poetry run mypy homr/main.py homr/system_finder.py tests/test_system_finder.py
          poetry run pytest -q --tb=short -o log_cli=false \
            tests/test_system_finder.py tests/test_system_crops.py tests/test_system_bounds_processing.py
          git checkout -- poetry.lock
          git diff --check
      - name: Publish validated CLI integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add homr/main.py homr/system_finder.py tests/test_system_finder.py
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Expose system-bound proposal in the homr CLI'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              push https://github.com/eerovil/homr.git HEAD:refs/heads/feature/system-finder-213
