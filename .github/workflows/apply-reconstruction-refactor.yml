name: Apply reconstruction refactor
on:
  push:
    branches: [refactor/reconstruction-boundary]
permissions:
  contents: read
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-reconstruction]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the locked development environment
        run: |
          python -m pip install -q poetry
          make init-poetry
      - name: Apply mechanical extraction and canonical formatting
        run: |
          set -euo pipefail
          python .github/reconstruction-refactor.py
          poetry run black homr/music_xml_generator.py homr/score_reconstruction.py
          poetry run isort homr/music_xml_generator.py homr/score_reconstruction.py
      - name: Verify source boundary and focused behavior
        run: |
          set -euo pipefail
          echo "music_xml_generator $(git hash-object homr/music_xml_generator.py)"
          echo "score_reconstruction $(git hash-object homr/score_reconstruction.py)"
          poetry run ruff check homr/music_xml_generator.py homr/score_reconstruction.py
          poetry run mypy homr/music_xml_generator.py homr/score_reconstruction.py
          poetry run python - <<'PY'
          from homr.music_xml_generator import (
              SymbolChord,
              TupletParser,
              add_tuplet_start_stop,
              find_common_division,
              find_division_and_time_signature_nominator,
              find_nominator_per_time_signature,
              group_into_chords,
              infer_meter_changes,
              prevailing_length,
              repair_bar_arithmetic,
          )
          assert all((SymbolChord, TupletParser, add_tuplet_start_stop, find_common_division,
                      find_division_and_time_signature_nominator, find_nominator_per_time_signature,
                      group_into_chords, infer_meter_changes, prevailing_length, repair_bar_arithmetic))
          PY
          poetry run pytest -q --tb=short -o log_cli=false \
            tests/test_bar_arithmetic_repair.py \
            tests/test_inferred_meter_changes.py \
            tests/test_time_signature_nominator.py \
            tests/test_music_xml_generator.py \
            tests/test_reread.py \
            tests/test_stem_voice_hints.py
          git diff --check
          git diff --exit-code -- fixtures fixturecheck
          test "$(git diff --name-only | sort)" = $'homr/music_xml_generator.py\nhomr/score_reconstruction.py'
      - name: Publish only the verified two-file refactor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="$(gh api repos/eerovil/homr/git/ref/heads/refactor/reconstruction-boundary --jq .object.sha)"
          test "$remote" = "$GITHUB_SHA"
          git add homr/music_xml_generator.py homr/score_reconstruction.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Separate token-level score reconstruction from MusicXML serialization' \
            -m 'Mechanically move existing SymbolChord, tuplet, bar-arithmetic and meter reconstruction logic without changing order or arithmetic. build_measures consumes ReconstructedVoice and all moved public import paths remain re-exported. Ruff, strict mypy and focused reconstruction/serialization tests passed before publication.'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push https://github.com/eerovil/homr.git HEAD:refs/heads/refactor/reconstruction-boundary
