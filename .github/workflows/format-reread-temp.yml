name: Format reread safety patch
on:
  push:
    branches: [fix/reread-selection-safety]
permissions:
  contents: read
jobs:
  format:
    if: github.event.head_commit.message == 'Temporarily format reread safety patch with canonical Black'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -q black==26.1.0
      - name: Format only reread.py and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(git hash-object homr/reread.py)"
          python -m black --line-length 100 --target-version py311 --preview homr/reread.py
          test "$(git diff --name-only)" = homr/reread.py
          test "$(git hash-object homr/reread.py)" != "$before"
          git diff --check
          remote="$(gh api repos/eerovil/homr/git/ref/heads/fix/reread-selection-safety --jq .object.sha)"
          test "$remote" = "$GITHUB_SHA"
          git add homr/reread.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Apply canonical Black formatting to reread coverage guard'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push https://github.com/eerovil/homr.git HEAD:refs/heads/fix/reread-selection-safety
